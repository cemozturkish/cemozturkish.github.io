<head>
<meta charset="utf-8" />

<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  height:100%;
  overflow:hidden;
}

body{
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color:#fff;
  background:#0a0a0a;
}

/* full-bleed background with slow Ken Burns drift */
.bg{
  position:fixed;
  inset:-20px;
  z-index:0;
  background-image:url("./assets/background.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  animation:bgDrift 25s ease-in-out infinite alternate;
}

@keyframes bgDrift{
  0%  { transform:scale(1.0)  translate(0, 0); }
  100%{ transform:scale(1.06) translate(-8px, -4px); }
}

/* layered overlay — gradient for depth */
.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(135deg, rgba(0,0,0,0.70) 0%, rgba(0,0,0,0.40) 50%, rgba(0,0,0,0.60) 100%);
}

/* navigation container — right-aligned, vertically centered */
.nav{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-end;
  height:100vh;
  padding-right:clamp(28px, 4vw, 60px);
  padding-top:12vh;
  gap:0;
}


/* category links */
.nav a{
  position:relative;
  display:block;
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(18px, 2.6vw, 30px);
  font-weight:200;
  color:rgba(255,255,255,0.55);
  text-decoration:none;
  letter-spacing:.06em;
  padding:10px 0;
  text-align:right;
  transform-origin:right center;
  transition:color .4s cubic-bezier(.25,.1,.25,1),
             transform .4s cubic-bezier(.25,.1,.25,1);
}

.nav a:hover{
  color:rgba(255,255,255,0.95);
  transform:scale(1.08);
}

/* entrance animation */
.nav a{
  opacity:0;
  animation:fadeIn .8s cubic-bezier(.16,1,.3,1) forwards;
}
.nav a:nth-child(1){ animation-delay:.15s; }
.nav a:nth-child(2){ animation-delay:.25s; }
.nav a:nth-child(3){ animation-delay:.35s; }
.nav a:nth-child(4){ animation-delay:.45s; }
.nav a:nth-child(5){ animation-delay:.55s; }
.nav a:nth-child(6){ animation-delay:.65s; }

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateX(30px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* mobile tweaks */
@media(max-width:600px){
  .nav{
    padding-right:28px;
  }
  .nav a{
    padding:8px 0;
  }
}

@media(prefers-reduced-motion:reduce){
  .bg{ animation:none; }
  .nav a{
    animation:none;
    opacity:1;
    transform:none;
  }
}
/* clickable head zone — SVG path traced from background */
.contact-zone{
  position:fixed;
  inset:-20px;
  width:calc(100% + 40px);
  height:calc(100% + 40px);
  z-index:2;
  pointer-events:none;
  animation:bgDrift 25s ease-in-out infinite alternate;
}
.contact-zone path{
  cursor:pointer;
  pointer-events:auto;
  fill:transparent;
  transition:fill .3s ease;
}
.contact-zone path:hover,
.contact-zone path.active{
  fill:rgba(0,0,0,0.15);
}

/* contact buttons beside head */
.contact-panel{
  position:fixed;
  left:38%;
  top:50%;
  transform:translateY(-50%) translateX(12px);
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:10px;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease, transform .4s ease;
}
.contact-panel.open{
  opacity:1;
  transform:translateY(-50%) translateX(0);
  pointer-events:auto;
}
.contact-panel a{
  display:block;
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(14px, 1.6vw, 20px);
  font-weight:200;
  color:rgba(255,255,255,0.7);
  text-decoration:none;
  letter-spacing:.06em;
  padding:6px 0;
  transition:color .3s ease;
}
.contact-panel a:hover{
  color:rgba(255,255,255,1);
}

/* mobile fallback trigger — the photo's clickable head zone is cropped
   out of frame on narrow/portrait viewports, so give mobile a visible
   way to reach contact info instead */
.nav a.contact-trigger{
  display:none;
}

@media(max-width:768px){
  .nav{
    padding-top:16vh;
  }

  .nav a.contact-trigger{
    display:block;
    position:fixed;
    right:clamp(28px, 4vw, 60px);
    bottom:24px;
    font-size:13px;
    letter-spacing:.1em;
    color:rgba(255,255,255,0.4);
    padding:0;
  }
  .nav a.contact-trigger:hover,
  .nav a.contact-trigger:active{
    color:rgba(255,255,255,0.8);
    transform:none;
  }

  /* contact panel — plain text, bottom-left, no frame */
  .contact-panel{
    left:24px;
    right:auto;
    top:auto;
    bottom:28px;
    width:auto;
    align-items:flex-start;
    text-align:left;
    background:none;
    transform:none;
  }
  .contact-panel.open{
    transform:none;
  }
  .contact-panel a{
    opacity:0;
    transform:translateX(-24px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .contact-panel.open a{
    opacity:1;
    transform:translateX(0);
  }
  /* visual order top-to-bottom: twitter, linkedin, instagram, email —
     staggered entrance starts from the bottom-most (email) and works up */
  .contact-panel a:nth-child(1){ order:4; transition-delay:0s;   } /* email */
  .contact-panel a:nth-child(2){ order:3; transition-delay:.08s; } /* instagram */
  .contact-panel a:nth-child(3){ order:1; transition-delay:.24s; } /* twitter */
  .contact-panel a:nth-child(4){ order:2; transition-delay:.16s; } /* linkedin */
}

/* page transition: curtain wipe */
.curtain{
  position:fixed; inset:0; z-index:9999;
  background:#0a0a0a;
}
.curtain.enter{
  animation:curtainOut .45s cubic-bezier(.4,0,.2,1) .05s both;
}
.curtain.enter-right{
  animation:curtainOutRight .45s cubic-bezier(.4,0,.2,1) .05s both;
}
.curtain.exit{
  animation:curtainIn .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes curtainIn{  from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes curtainOut{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
@keyframes curtainOutRight{ from{transform:translateX(0)} to{transform:translateX(100%)} }

/* intro spotlight — darkens everything except the head, then fades */
.intro-spotlight{
  position:fixed;
  inset:-20px;
  width:calc(100% + 40px);
  height:calc(100% + 40px);
  z-index:1;
  pointer-events:none;
  animation:bgDrift 25s ease-in-out infinite alternate;
}
.intro-spotlight path{
  animation:spotlightFade 4.5s ease-out 0.5s forwards;
}
@keyframes spotlightFade{
  to{ fill-opacity:0; }
}

/* section panel — slides in from right */
.section-panel{
  position:fixed;
  right:0; top:0;
  width:65%;
  height:100%;
  z-index:4;
  background:rgba(0,0,0,0.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow-y:auto;
  transform:translateX(100%);
  opacity:0;
  transition:transform .45s cubic-bezier(.25,.1,.25,1),
             opacity .45s cubic-bezier(.25,.1,.25,1);
  pointer-events:none;
}
.section-panel.open{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}
.section-panel .panel-close{
  position:sticky;
  top:0;
  display:block;
  padding:20px clamp(24px, 4vw, 60px);
  font-size:14px;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.5);
  text-decoration:none;
  cursor:pointer;
  background:transparent;
  border:none;
  font-family:inherit;
  transition:color .2s;
  z-index:1;
}
.section-panel .panel-close:hover{
  color:rgba(255,255,255,0.9);
}
.section-panel .panel-body{
  padding:0 clamp(24px, 4vw, 60px) 60px;
}
.section-panel .panel-body h1{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(18px, 2.6vw, 30px);
  font-weight:200;
  letter-spacing:.06em;
  color:rgba(255,255,255,0.55);
  margin-bottom:40px;
  text-align:center;
}
.section-panel .panel-body .masonry{
  column-count:3;
  column-gap:20px;
}
.section-panel .panel-body .masonry img{
  width:100%;
  height:auto;
  margin-bottom:20px;
  break-inside:avoid;
  display:block;
  opacity:0;
  transform:translateY(30px);
  filter:blur(4px);
  transition:opacity .65s ease, transform .65s ease, filter .8s ease;
}
.section-panel .panel-body .masonry img.visible{
  opacity:0.9;
  transform:translateY(0);
  filter:blur(0);
}
.section-panel .panel-body .bio{
  font-size:18px;
  line-height:1.7;
  color:rgba(255,255,255,0.7);
}
.section-panel .panel-body .bio p{
  margin-bottom:20px;
}
.section-panel .panel-body .about-section-title{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.8vw, 20px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.4);
  text-align:center;
  margin:0 0 24px;
}
.section-panel .panel-body .about-me-scroll{
  font-size:clamp(13px, 1.3vw, 16px);
  line-height:1.7;
  color:rgba(255,255,255,0.55);
}
.section-panel .panel-body .about-me-scroll p{ margin-bottom:14px; }
/* About: title + education stay put, only the "about me" text scrolls */
.section-panel.fixed{ display:flex; flex-direction:column; overflow:hidden; }
.section-panel.fixed .panel-close{ flex:none; align-self:flex-start; }
.section-panel.fixed .panel-body{
  flex:1; min-height:0; display:flex; flex-direction:column;
  padding-bottom:0; overflow-y:auto;
}
.section-panel.fixed .panel-body > *{ flex:none; }
.section-panel.fixed .panel-body > .bio{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.section-panel.fixed .about-edu{ flex:none; }
.section-panel.fixed .about-me{ flex:1; min-height:160px; display:flex; flex-direction:column; margin-top:12px; }
.section-panel.fixed .about-me .about-section-title{ flex:none; }
@media(max-width:600px){
  .section-panel.fixed .panel-close{ padding-top:14px; padding-bottom:10px; }
  .section-panel.fixed .panel-body h1{ margin-bottom:22px; }
  .section-panel.fixed .about-section-title{ font-size:14px; margin-bottom:14px; }
  .section-panel.fixed .edu-entry{ margin-bottom:16px; }
  .section-panel.fixed .about-me{ min-height:120px; margin-top:8px; }
}
.section-panel.fixed .about-me-scroll{
  flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; padding-bottom:48px;
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
          mask-image:linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
}
.section-panel .panel-body .edu-entry{
  margin-bottom:28px;
}
.section-panel .panel-body .edu-entry .edu-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:16px;
}
.section-panel .panel-body .edu-entry .edu-school{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.6vw, 19px);
  font-weight:300;
  color:rgba(255,255,255,0.85);
  letter-spacing:.04em;
}
.section-panel .panel-body .edu-entry .edu-location{
  font-size:clamp(12px, 1.2vw, 14px);
  color:rgba(255,255,255,0.45);
  white-space:nowrap;
}
.section-panel .panel-body .edu-entry .edu-degree{
  font-size:clamp(13px, 1.3vw, 16px);
  color:rgba(255,255,255,0.55);
  margin-top:4px;
}
.section-panel .panel-body .edu-entry .edu-date{
  font-size:clamp(12px, 1.2vw, 14px);
  color:rgba(255,255,255,0.4);
  white-space:nowrap;
}
.section-panel .panel-body .empty{
  color:rgba(255,255,255,0.4);
  font-size:16px;
  letter-spacing:.04em;
}
.section-panel .panel-body .exp-section{ margin-bottom:60px; }
.section-panel .panel-body .exp-section:last-child{ margin-bottom:0; }
.section-panel .panel-body .exp-section-title{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.8vw, 20px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.4);
  text-align:center;
  margin:0 auto 24px;
  max-width:800px;
}
.section-panel .panel-body .exp-list{
  max-width:800px;
  margin:0 auto 30px;
}
.section-panel .panel-body .exp-entry{ margin-bottom:32px; }
.section-panel .panel-body .exp-entry .exp-head{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:16px; flex-wrap:wrap;
}
.section-panel .panel-body .exp-entry .exp-org{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px,1.6vw,19px);
  font-weight:300;
  color:rgba(255,255,255,0.85);
  letter-spacing:.04em;
}
.section-panel .panel-body .exp-entry .exp-location{
  font-size:clamp(12px,1.2vw,14px);
  color:rgba(255,255,255,0.45);
  white-space:nowrap;
}
.section-panel .panel-body .exp-role{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:16px; flex-wrap:wrap; margin-top:6px;
}
.section-panel .panel-body .exp-role .exp-title{
  font-size:clamp(13px,1.3vw,16px);
  color:rgba(255,255,255,0.6);
  font-style:italic;
}
.section-panel .panel-body .exp-role .exp-date{
  font-size:clamp(12px,1.2vw,14px);
  color:rgba(255,255,255,0.4);
  white-space:nowrap;
}
.section-panel .panel-body .exp-entry ul{
  list-style:none; margin-top:8px; padding-left:0;
}
.section-panel .panel-body .exp-entry ul li{
  position:relative; font-size:14px; line-height:1.6;
  color:rgba(255,255,255,0.6); margin-top:6px; padding-left:16px;
}
.section-panel .panel-body .exp-entry ul li::before{
  content:"·"; position:absolute; left:4px; color:rgba(255,255,255,0.4);
}
@media(max-width:900px){
  .section-panel{ width:85%; }
  .section-panel .panel-body .masonry{ column-count:2; }
}
@media(max-width:500px){
  .section-panel{ width:100%; }
  .section-panel .panel-body .masonry{ column-count:2; }
}
</style>
</head>

<script>
(function(){
  var c = document.getElementById('curtain');
  if(sessionStorage.getItem('nav-back')){
    c.className = 'curtain enter-right';
    sessionStorage.removeItem('nav-back');
  }
  // contact panel toggle — clicking the head trace path, or (on mobile,
  // where the head is cropped out of frame) the CONTACT nav link
  var headZone = document.getElementById('headZone');
  var contactTrigger = document.getElementById('contactTrigger');
  var panel = document.getElementById('contactPanel');
  function toggleContactPanel(){ panel.classList.toggle('open'); headZone.classList.toggle('active'); }
  headZone.addEventListener('click', toggleContactPanel);
  contactTrigger.addEventListener('click', function(e){ e.preventDefault(); toggleContactPanel(); });
  // close panel when clicking outside
  document.addEventListener('click', function(e){
    if(panel.classList.contains('open') && !panel.contains(e.target) && e.target !== headZone && e.target !== contactTrigger){
      panel.classList.remove('open');
      headZone.classList.remove('active');
    }
  });

  // section panel logic
  var secPanel = document.getElementById('sectionPanel');
  var secBody = document.getElementById('panelBody');
  var secClose = document.getElementById('panelClose');

  // wording and photos come from content.json (edited through /admin)
  var content = Site.load();

  content.then(function(c){
    document.querySelectorAll('.nav a[data-page]').forEach(function(a){
      var p = c[a.dataset.page];
      if(p && p.title) a.textContent = p.title;
    });
    var ct = c.contact || {};
    function setLink(id, url, text){
      var a = document.getElementById(id);
      if(!url){ a.style.display = 'none'; return; }
      a.href = url;
      if(text) a.textContent = text;
    }
    setLink('cEmail', ct.email ? 'mailto:' + ct.email : '', ct.email);
    setLink('cInstagram', ct.instagram);
    setLink('cTwitter', ct.twitter);
    setLink('cLinkedin', ct.linkedin);
  });

  function addGallery(parent, photos){
    var g = document.createElement('div');
    g.className = 'masonry';
    parent.appendChild(g);
    Site.gallery(g, photos, secPanel);
  }

  function openSection(page){
    content.then(function(c){
      var p = c[page];
      if(!p) return;
      secBody.innerHTML = '';
      if(page === 'events' && p.headerImage){
        var himg = document.createElement('img');
        himg.src = Site.src(p.headerImage);
        himg.alt = p.title;
        himg.style.cssText = 'display:block;margin:0 auto 40px;max-width:clamp(160px,22vw,280px);height:auto;opacity:0.9;';
        secBody.appendChild(himg);
      } else if(Site.heading(p)){
        var h = document.createElement('h1');
        h.textContent = Site.heading(p);
        secBody.appendChild(h);
      }
      secPanel.classList.toggle('fixed', page === 'about');
      if(page === 'about'){
        secBody.insertAdjacentHTML('beforeend', '<div class="bio">' + Site.aboutHTML(p) + '</div>');
      } else if(page === 'experiences'){
        (p.sections || []).forEach(function(sec){
          var section = document.createElement('div');
          section.className = 'exp-section';
          var sh = document.createElement('h2');
          sh.className = 'exp-section-title';
          sh.textContent = sec.title;
          section.appendChild(sh);
          section.insertAdjacentHTML('beforeend', Site.entriesHTML(sec.entries));
          secBody.appendChild(section);
          addGallery(section, Site.visible(sec));
        });
      } else {
        secBody.insertAdjacentHTML('beforeend', Site.entriesHTML(p.entries));
        addGallery(secBody, Site.visible(p));
      }
      secPanel.classList.add('open');
      secPanel.scrollTop = 0;
    });
  }

  function closeSection(){
    secPanel.classList.remove('open');
  }

  secClose.addEventListener('click', closeSection);

  document.querySelectorAll('.nav a:not(.contact-trigger)').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      openSection(a.dataset.page);
    });
  });

  // close section panel when clicking outside
  document.addEventListener('click', function(e){
    if(secPanel.classList.contains('open') && !secPanel.contains(e.target) && !e.target.closest('.nav')){
      closeSection();
    }
  });
})();
</script>
</body>
</html>
