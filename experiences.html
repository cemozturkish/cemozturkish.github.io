<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EXPERIENCES BY CEM</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,200;0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  min-height:100%;
}

body{
  font-family: 'Josefin Sans', sans-serif;   /* one font for the whole site */
  background:#0a0a0a;
  color:#fff;
}

.bg{
  position:fixed; inset:0; z-index:-1;
  background:url("./assets/background.jpg") center/cover no-repeat;
}
.bg::after{
  content:""; position:absolute; inset:0;
  background:rgba(0,0,0,0.75);
}

.wrap{
  max-width:1400px;
  margin:0 auto;
  padding:40px clamp(24px, 4vw, 60px);
}

.back{
  display:inline-block;
  font-size:14px;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.5);
  text-decoration:none;
  margin-bottom:20px;
  transition:color .2s;
}
.back:hover{ color:rgba(255,255,255,0.9); }

h1{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(18px, 2.6vw, 30px);
  font-weight:200;
  letter-spacing:.06em;
  color:rgba(255,255,255,0.55);
  margin-bottom:40px;
  text-align:center;
}

h2.exp-section-title{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.8vw, 20px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.4);
  text-align:center;
  margin:0 auto 24px;
  max-width:800px;
}

.exp-section{ margin-bottom:60px; }
.exp-section:last-child{ margin-bottom:0; }

.exp-list{ max-width:800px; margin:0 auto 30px; }
.exp-entry{ margin-bottom:32px; }
.exp-entry:last-child{ margin-bottom:0; }
.exp-entry .exp-head{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
.exp-entry .exp-org{ font-family:'Josefin Sans', sans-serif; font-size:clamp(15px,1.6vw,19px); font-weight:300; color:rgba(255,255,255,0.85); letter-spacing:.04em; }
.exp-entry .exp-location{ font-size:clamp(12px,1.2vw,14px); color:rgba(255,255,255,0.45); white-space:nowrap; }
.exp-role{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-top:6px; }
.exp-role .exp-title{ font-size:clamp(13px,1.3vw,16px); color:rgba(255,255,255,0.6); font-style:normal; }
.exp-role .exp-date{ font-size:clamp(12px,1.2vw,14px); color:rgba(255,255,255,0.4); white-space:nowrap; }
.exp-entry ul{ list-style:none; margin-top:8px; padding-left:0; }
.exp-entry ul li{ position:relative; font-size:14px; line-height:1.6; color:rgba(255,255,255,0.6); margin-top:6px; padding-left:16px; }
.exp-entry ul li::before{ content:"·"; position:absolute; left:4px; color:rgba(255,255,255,0.4); }

.masonry{
  column-count:4;
  column-gap:20px;
}
.masonry img{
  width:100%;
  height:auto;
  margin-bottom:20px;
  break-inside:avoid;
  display:block;
  opacity:0;
  transform:translateY(30px);
  filter:blur(4px);
  transition:opacity .65s ease, transform .65s ease, filter .8s ease;
}
.masonry img.visible{
  opacity:0.9;
  transform:translateY(0);
  filter:blur(0);
}

@media(max-width:1200px){ .masonry{column-count:3;} }
@media(max-width:900px){  .masonry{column-count:2;} }
@media(max-width:500px){  .masonry{column-count:2;} }

@media(prefers-reduced-motion:reduce){
  .masonry img{
    transition:none;
    opacity:1;
    transform:none;
    filter:none;
  }
}

.curtain{
  position:fixed; inset:0; z-index:9999;
  background:#0a0a0a;
}
.curtain.enter{
  animation:curtainOut .45s cubic-bezier(.4,0,.2,1) .05s both;
}
.curtain.exit{
  animation:curtainIn .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes curtainIn{  from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes curtainOut{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
.curtain.exit-left{
  animation:curtainInLeft .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes curtainInLeft{ from{transform:translateX(-100%)} to{transform:translateX(0)} }

/* sticky header: HOME link + page title stay put, with a dark fade behind them */
.wrap{ padding-top:0; }
.page-head{
  position:sticky; top:0; z-index:5;
  padding:24px 0 6px;
  pointer-events:none;
}
.page-head .back, .page-head h1{ text-shadow:0 0 1px #000, 0 0 2px #000, 0 0 3px #000, 0 0 4px #000, 0 0 5px #000, 0 0 7px #000, 0 0 9px #000, 0 0 12px #000, 0 0 16px #000, 0 0 22px rgba(0,0,0,0.85); }
.page-head .back{ color:#808080; }
.page-head .back:hover{ color:#e6e6e6; }
.page-head h1{ color:#8c8c8c; }
.page-head .back{ margin-bottom:10px; pointer-events:auto; }
.page-head h1{ margin:0; }
.page-head img{ transition:max-width .3s ease; filter:drop-shadow(0 0 6px rgba(0,0,0,0.9)) drop-shadow(0 0 14px rgba(0,0,0,0.8)); }
body.scrolled .page-head img{ max-width:clamp(80px, 9vw, 120px) !important; }
.page-head + *{ margin-top:34px; }

/* Collapsing resume (Work Experiences): titles, organisations and job titles stick and
   pile up for the rest of the page; bullets and photos scroll away under the stack.
   Every row sits directly in one container spanning the whole list, so it stays stuck. */
/* shrunk rows are laid out wider than the column; never let that widen the page */
.resume-stack{ overflow-x:clip; padding-bottom:0 !important; margin:0 !important; }
/* the one container that holds the whole flat list (galleries use the full width) */
.resume-flat{ max-width:none !important; margin:0 !important; }
.resume-stack .exp-head, .resume-stack .exp-role, .resume-stack ul{
  max-width:800px; margin-left:auto !important; margin-right:auto !important;
}
.resume-stack .stack-item{
  position:sticky; z-index:1; cursor:pointer; line-height:1.3;
  -webkit-tap-highlight-color:transparent;
  text-shadow:0 0 1px #000, 0 0 2px #000, 0 0 3px #000, 0 0 4px #000, 0 0 5px #000, 0 0 7px #000, 0 0 9px #000, 0 0 12px #000, 0 0 16px #000, 0 0 22px rgba(0,0,0,0.85);
}
.resume-stack .exp-head{ margin-top:22px !important; }
.resume-stack .exp-role{ margin-top:4px !important; }
.resume-stack ul{ margin-top:6px !important; margin-bottom:4px; }
.resume-stack h2.exp-section-title{
  width:fit-content; padding:0 10px; margin:40px auto 0 !important;
  color:#666 !important; transition:color .2s;
}
.resume-stack h2.exp-section-title:hover{ color:#bbb !important; }
.resume-stack .masonry{ margin-top:20px; }
/* rows shrink (by --rs) as they lock into the stack, so the whole collapsed resume fits on
   one screen; their space in the page stays the same, so nothing below jumps */
.resume-stack .stack-item{ transform-origin:0 0; transition:transform .25s ease, top .25s ease, opacity .2s, color .2s; }
/* once the stack fills the screen it slides up; rows that pass under the header hide */
.resume-stack .stack-item.tucked{ opacity:0; pointer-events:none; }
.resume-stack h2.exp-section-title{ transform-origin:50% 0; }
.resume-stack .stack-item.stuck{ transform:scale(var(--rs, 1)); }
/* a stuck row keeps its normal height in the page; keep wrapped lines packed at the top
   instead of spread over that height */
.resume-stack .stack-item{ align-content:flex-start; }
.resume-stack .exp-head.stuck, .resume-stack .exp-role.stuck,
.resume-stack.measure-collapsed .exp-head, .resume-stack.measure-collapsed .exp-role{
  /* drawn at --rs, so lay out wider to still span the column once shrunk */
  width:calc(100% / var(--rs, 1)) !important;
  max-width:calc(800px / var(--rs, 1)) !important;
  margin-left:max(0px, calc((100% - 800px) / 2)) !important;  /* stay in the centred column */
  margin-right:0 !important;
}
.resume-stack.measure-collapsed .stack-item{ height:auto !important; transition:none; }
.stack-page-title{ cursor:pointer; pointer-events:auto; }
</style>
</head>

<body>
<div class="bg"></div>
<div class="curtain enter"></div>
<div class="wrap">
  <div class="page-head">
    <a class="back" href="./index.html">&larr; HOME</a>
    <h1 id="title">EXPERIENCES</h1>
  </div>
  <div id="sections"></div>
</div>

<script src="./site.js"></script>
<script>
Site.load().then(c => {
  document.getElementById('title').textContent = Site.heading(c.experiences);
  if(!Site.heading(c.experiences)) document.getElementById('title').style.display = 'none';
  const root = document.getElementById('sections');
  const resume = Site.buildResume(root, c.experiences.sections, (parent, photos) => {
    const g = document.createElement('div');
    g.className = 'masonry';
    parent.appendChild(g);
    Site.gallery(g, photos);
  });
  requestAnimationFrame(() => Site.stackResume(resume, window, document.querySelector('.page-head'), document.getElementById('title'), c.experiences.stackScale));
});
(function(){
  document.querySelectorAll('a.back').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const href = a.href;
      const c = document.createElement('div');
      c.className = 'curtain exit-left';
      document.body.appendChild(c);
      sessionStorage.setItem('nav-back','1');
      setTimeout(() => { window.location = href; }, 420);
    });
  });
})();
</script>
</body>
</html>
