<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ABOUT CEM</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet" />

<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  min-height:100%;
}

body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Helvetica, Arial, sans-serif;
  background:#0a0a0a;
  color:#fff;
}

.bg{
  position:fixed; inset:0; z-index:-1;
  background:url("./assets/background.jpg") center/cover no-repeat;
}
.bg::after{
  content:""; position:absolute; inset:0;
  background:rgba(0,0,0,0.75);
}

.wrap{
  max-width:800px;
  margin:0 auto;
  padding:40px clamp(24px, 4vw, 60px);
}

.back{
  display:inline-block;
  font-size:14px;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.5);
  text-decoration:none;
  margin-bottom:20px;
  transition:color .2s;
}
.back:hover{ color:rgba(255,255,255,0.9); }

h1{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(18px, 2.6vw, 30px);
  font-weight:200;
  letter-spacing:.06em;
  color:rgba(255,255,255,0.55);
  margin-bottom:40px;
  text-align:center;
}

.bio{
  font-size:18px;
  line-height:1.7;
  color:rgba(255,255,255,0.7);
}

.bio p{
  margin-bottom:20px;
}
/* title + education stay put, only the "about me" text scrolls */
.wrap{
  height:100vh; height:100dvh;
  display:flex; flex-direction:column; padding-bottom:0;
}
.wrap > *{ flex:none; }
.wrap > .bio{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; }
.about-edu{ flex:none; }
.about-section-title{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.8vw, 20px);
  font-weight:300;
  letter-spacing:.08em;
  color:rgba(255,255,255,0.4);
  text-align:center;
  margin:0 0 24px;
}
.about-me{ flex:1; min-height:160px; display:flex; flex-direction:column; margin-top:12px; }
.about-me .about-section-title{ flex:none; }
.about-me-scroll{
  flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; padding-bottom:48px;
  font-size:clamp(13px, 1.3vw, 16px); line-height:1.7; color:rgba(255,255,255,0.55);
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
          mask-image:linear-gradient(to bottom, #000 calc(100% - 48px), transparent);
}
.about-me-scroll p{ margin-bottom:14px; }
@media(max-width:600px){
  .wrap{ padding-top:24px; }
  .back{ margin-bottom:12px; }
  h1{ margin-bottom:22px; }
  .about-section-title{ font-size:14px; margin-bottom:14px; }
  .about-me{ min-height:120px; margin-top:8px; }
}

.edu-entry{ margin-bottom:28px; }
.edu-entry .edu-row{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:16px; flex-wrap:wrap;
}
.edu-entry .edu-school{
  font-family:'Josefin Sans', sans-serif;
  font-size:clamp(15px, 1.6vw, 19px);
  font-weight:300;
  color:rgba(255,255,255,0.85);
  letter-spacing:.04em;
}
.edu-entry .edu-location{
  font-size:clamp(12px, 1.2vw, 14px);
  color:rgba(255,255,255,0.45);
  white-space:nowrap;
}
.edu-entry .edu-degree{
  font-size:clamp(13px, 1.3vw, 16px);
  color:rgba(255,255,255,0.55);
  margin-top:4px;
}
.edu-entry .edu-date{
  font-size:clamp(12px, 1.2vw, 14px);
  color:rgba(255,255,255,0.4);
  white-space:nowrap;
}

/* entrance */
.bio, h1{
  opacity:0;
  transform:translateY(18px);
  animation:fadeUp .6s ease forwards;
}
h1{ animation-delay:.1s; }
.bio{ animation-delay:.25s; }

@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.curtain{
  position:fixed; inset:0; z-index:9999;
  background:#0a0a0a;
}
.curtain.enter{
  animation:curtainOut .45s cubic-bezier(.4,0,.2,1) .05s both;
}
.curtain.exit{
  animation:curtainIn .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes curtainIn{  from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes curtainOut{ from{transform:translateX(0)} to{transform:translateX(-100%)} }
.curtain.exit-left{
  animation:curtainInLeft .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes curtainInLeft{ from{transform:translateX(-100%)} to{transform:translateX(0)} }
/* tighter spacing between schools (kept last so it wins over the rules above) */
.about-edu .edu-entry{ margin-bottom:18px; line-height:1.45; }
.about-edu .edu-entry .edu-degree{ margin-top:2px; }
@media(max-width:600px){
  .about-edu .edu-entry{ margin-bottom:12px; }
}

/* sticky header: HOME link + page title stay put, with a dark fade behind them */
html{ overflow-x:hidden; }
.wrap{ padding-top:0; }
.page-head{
  position:sticky; top:0; z-index:5;
  padding:24px 0 26px;
}
.page-head::before{
  content:""; position:absolute; top:0; bottom:0; left:50%; width:100vw; transform:translateX(-50%);
  z-index:-1;
  background:linear-gradient(to bottom, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.9) calc(100% - 26px), rgba(0,0,0,0) 100%);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
          mask-image:linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
}
.page-head .back{ margin-bottom:10px; }
.page-head h1{ margin-bottom:0; text-shadow:0 2px 12px rgba(0,0,0,0.6); }
.page-head img{ transition:max-width .3s ease; }
body.scrolled .page-head img{ max-width:clamp(80px, 9vw, 120px) !important; }
.page-head + *{ margin-top:14px; }
</style>
</head>

<body>
<div class="bg"></div>
<div class="curtain enter"></div>
<div class="wrap">
  <div class="page-head">
    <a class="back" href="./index.html">&larr; HOME</a>
    <h1 id="title">ABOUT</h1>
  </div>
  <div class="bio" id="bio"></div>
</div>

<script src="./site.js"></script>
<script>
Site.load().then(c => {
  const title = document.getElementById('title');
  title.textContent = Site.heading(c.about, '');
  if(!title.textContent) title.style.display = 'none';
  document.getElementById('bio').innerHTML = Site.aboutHTML(c.about);
});
(function(){
  document.querySelectorAll('a.back').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const href = a.href;
      const c = document.createElement('div');
      c.className = 'curtain exit-left';
      document.body.appendChild(c);
      sessionStorage.setItem('nav-back','1');
      setTimeout(() => { window.location = href; }, 420);
    });
  });
})();
</script>
</body>
</html>
